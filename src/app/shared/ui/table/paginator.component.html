
<div class="paginator">
  <span class="summary">
    @if (totalElements() > 0) {
      Página {{ page() + 1 }} de {{ totalPages() }} · {{ totalElements() }} resultados
    } @else {
      Sin resultados
    }
  </span>
  <div class="controls">
    <button type="button" [disabled]="page() === 0" (click)="goTo(page() - 1)">Anterior</button>
    <button type="button" [disabled]="!hasNext()" (click)="goTo(page() + 1)">Siguiente</button>
  </div>
</div>
